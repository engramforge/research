<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">Benchmark Pipeline Architecture</text>

  <!-- Arrowhead markers (must precede usage) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4A6FA5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2A8F82"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 1: Inputs -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Task Definition -->
  <rect x="32" y="64" width="180" height="72" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="122" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Task Definition</text>
  <text x="122" y="108" text-anchor="middle" font-size="10" fill="#555">YAML specification</text>
  <text x="122" y="122" text-anchor="middle" font-size="10" fill="#555">requirements, constraints</text>

  <!-- Baseline Codebase -->
  <rect x="236" y="64" width="180" height="72" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="326" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Baseline Codebase</text>
  <text x="326" y="108" text-anchor="middle" font-size="10" fill="#555">existing source files</text>
  <text x="326" y="122" text-anchor="middle" font-size="10" fill="#555">tests, config, fixtures</text>

  <!-- Prompt Template -->
  <rect x="440" y="64" width="180" height="72" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="530" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Prompt Template</text>
  <text x="530" y="108" text-anchor="middle" font-size="10" fill="#555">framework-specific</text>
  <text x="530" y="122" text-anchor="middle" font-size="10" fill="#555">patterns, format spec</text>

  <!-- Model Config -->
  <rect x="644" y="64" width="180" height="72" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="734" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Model Configuration</text>
  <text x="734" y="108" text-anchor="middle" font-size="10" fill="#555">API backend, temperature</text>
  <text x="734" y="122" text-anchor="middle" font-size="10" fill="#555">token limits, pricing</text>

  <!-- Row 1 label -->
  <text x="932" y="100" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 100)">INPUTS</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Arrows: Row 1 → Row 2 -->
  <!-- ═══════════════════════════════════════════ -->
  <path d="M122 136 L122 160 L390 160 L390 176" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M326 136 L326 160 L390 160" stroke="#4A6FA5" stroke-width="1.5" fill="none"/>
  <path d="M530 136 L530 160 L390 160" stroke="#4A6FA5" stroke-width="1.5" fill="none"/>
  <path d="M734 136 L734 160 L390 160" stroke="#4A6FA5" stroke-width="1.5" fill="none"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 2: Prompt Assembly -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="260" y="176" width="260" height="56" rx="6" fill="#4A6FA5" stroke="#3A5F95" stroke-width="1.5"/>
  <text x="390" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Prompt Assembly</text>
  <text x="390" y="216" text-anchor="middle" font-size="10" fill="#D6E0F0">role + requirements + patterns + baseline code</text>

  <!-- Row 2 label -->
  <text x="932" y="204" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 204)">BUILD</text>

  <!-- Arrow: Row 2 → Row 3 -->
  <path d="M390 232 L390 264" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 3: LLM Call -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="260" y="264" width="260" height="56" rx="6" fill="#2A8F82" stroke="#1A7F72" stroke-width="1.5"/>
  <text x="390" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">LLM API Call</text>
  <text x="390" y="304" text-anchor="middle" font-size="10" fill="#C8EDE8">OpenAI · Anthropic · Ollama</text>

  <!-- Side annotation: tokens/cost -->
  <rect x="548" y="268" width="140" height="48" rx="4" fill="#F5FAF9" stroke="#2A8F82" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="618" y="286" text-anchor="middle" font-size="10" font-weight="500" fill="#2A8F82">Metrics Captured</text>
  <text x="618" y="300" text-anchor="middle" font-size="9" fill="#555">tokens, cost, latency</text>
  <text x="618" y="312" text-anchor="middle" font-size="9" fill="#555">finish reason</text>
  <line x1="520" y1="292" x2="548" y2="292" stroke="#2A8F82" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Row 3 label -->
  <text x="932" y="292" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 292)">GENERATE</text>

  <!-- Arrow: Row 3 → Row 4 -->
  <path d="M390 320 L390 352" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 4: Output Parsing -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="260" y="352" width="260" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="390" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A2E">Output Parsing</text>
  <text x="390" y="392" text-anchor="middle" font-size="10" fill="#555">extract FILE: blocks → apply to workspace</text>

  <!-- Row 4 label -->
  <text x="932" y="380" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 380)">PARSE</text>

  <!-- Arrow: Row 4 → Row 5 -->
  <path d="M390 408 L390 440" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 5: Quality Gates (5 boxes) -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Gate 1: Diff Extract -->
  <rect x="32" y="440" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="110" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Gate 1</text>
  <text x="110" y="480" text-anchor="middle" font-size="10" fill="#555">Diff Extraction</text>

  <!-- Gate 2: Diff Apply -->
  <rect x="208" y="440" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="286" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Gate 2</text>
  <text x="286" y="480" text-anchor="middle" font-size="10" fill="#555">Diff Application</text>

  <!-- Gate 3: Tests -->
  <rect x="384" y="440" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="462" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Gate 3</text>
  <text x="462" y="480" text-anchor="middle" font-size="10" fill="#555">Test Execution</text>

  <!-- Gate 4: Type Check -->
  <rect x="560" y="440" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="638" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Gate 4</text>
  <text x="638" y="480" text-anchor="middle" font-size="10" fill="#555">Type Checking</text>

  <!-- Gate 5: Lint -->
  <rect x="736" y="440" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="814" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Gate 5</text>
  <text x="814" y="480" text-anchor="middle" font-size="10" fill="#555">Lint Analysis</text>

  <!-- Connecting line across gates -->
  <path d="M390 408 L110 440" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 408 L286 440" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 408 L462 440" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 408 L638 440" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 408 L814 440" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Tool labels under gates -->
  <text x="110" y="508" text-anchor="middle" font-size="9" fill="#8B8FA3">regex parser</text>
  <text x="286" y="508" text-anchor="middle" font-size="9" fill="#8B8FA3">git apply</text>
  <text x="462" y="508" text-anchor="middle" font-size="9" fill="#8B8FA3">pytest · xUnit · Maven</text>
  <text x="638" y="508" text-anchor="middle" font-size="9" fill="#8B8FA3">mypy · Roslyn · javac</text>
  <text x="814" y="508" text-anchor="middle" font-size="9" fill="#8B8FA3">ruff · analyzers</text>

  <!-- Row 5 label -->
  <text x="932" y="472" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 472)">VALIDATE</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Row 6: Results -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Arrows down from gates -->
  <path d="M110 496 L110 528 L390 528 L390 544" stroke="#4A6FA5" stroke-width="1" fill="none"/>
  <path d="M286 496 L286 528 L390 528" stroke="#4A6FA5" stroke-width="1" fill="none"/>
  <path d="M462 496 L462 528 L390 528" stroke="#4A6FA5" stroke-width="1" fill="none"/>
  <path d="M638 496 L638 528 L390 528" stroke="#4A6FA5" stroke-width="1" fill="none"/>
  <path d="M814 496 L814 528 L390 528" stroke="#4A6FA5" stroke-width="1" fill="none"/>
  <path d="M390 528 L390 544" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Results box -->
  <rect x="260" y="544" width="260" height="56" rx="6" fill="#1A1A2E" stroke="#1A1A2E" stroke-width="1.5"/>
  <text x="390" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Results &amp; Statistics</text>
  <text x="390" y="584" text-anchor="middle" font-size="10" fill="#A8ADBE">gate scores, metrics, cost</text>

  <!-- Entropy control feedback arrow -->
  <rect x="628" y="548" width="168" height="48" rx="6" fill="#E8F5E9" stroke="#2A8F82" stroke-width="1.5"/>
  <text x="712" y="568" text-anchor="middle" font-size="11" font-weight="600" fill="#1A7F72">Entropy Control</text>
  <text x="712" y="584" text-anchor="middle" font-size="10" fill="#555">variance → re-run?</text>
  <path d="M520 572 L628 572" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)"/>

  <!-- Feedback loop arrow from entropy back to LLM -->
  <path d="M796 572 L836 572 L836 292 L520 292" stroke="#2A8F82" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#arrow-teal)"/>
  <text x="846" y="436" text-anchor="start" font-size="9" font-weight="500" fill="#2A8F82" transform="rotate(-90 846 436)">re-run if variance high</text>

  <!-- Row 6 label -->
  <text x="932" y="572" text-anchor="end" font-size="10" font-weight="600" fill="#8B8FA3" transform="rotate(-90 932 572)">OUTPUT</text>

</svg>
