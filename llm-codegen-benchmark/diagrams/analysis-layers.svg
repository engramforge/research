<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="680" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="420" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">Code Quality Meta-Analysis: Four Layers</text>
  <text x="420" y="54" text-anchor="middle" font-size="11" fill="#8B8FA3">From per-run metrics → model generation fingerprints · 165 entropy-controlled runs · 11 models × 3 languages</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4A6FA5"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2A8F82"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E09600"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Layer 1: Per-Run Quality Extraction          -->
  <!-- Split into INLINE (automated) and ASYNC (judge) -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Inline automated metrics — runs during benchmark -->
  <rect x="60" y="80" width="480" height="112" rx="8" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="2"/>
  <text x="80" y="102" font-size="13" font-weight="700" fill="#4A6FA5">Layer 1a</text>
  <text x="155" y="102" font-size="13" font-weight="600" fill="#1A1A2E">Automated Metrics</text>
  <text x="430" y="102" font-size="9" fill="#8B8FA3">inline — runs with benchmark</text>

  <rect x="80" y="114" width="440" height="68" rx="4" fill="#FFFFFF" stroke="#D6E0F0" stroke-width="1"/>
  <text x="96" y="132" font-size="11" font-weight="600" fill="#1A1A2E">static_analysis.py</text>
  <text x="96" y="148" font-size="9" fill="#555">• Cyclomatic complexity  • LOC / function count  • Nesting depth</text>
  <text x="96" y="162" font-size="9" fill="#555">• Type annotation coverage  • Docstring density  • Import hygiene</text>
  <text x="96" y="176" font-size="9" fill="#555">• Async ratio  • Security scan (bandit)  → quality/automated.json</text>

  <!-- Async LLM judge — runs separately, later -->
  <rect x="560" y="74" width="220" height="124" rx="8" fill="#FFF8ED" stroke="#F5A623" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="570" y="64" width="66" height="16" rx="4" fill="#F5A623"/>
  <text x="603" y="75" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Layer 1b</text>
  <rect x="642" y="64" width="42" height="16" rx="4" fill="#E09600"/>
  <text x="663" y="75" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">async</text>

  <text x="670" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">LLM Judge</text>
  <text x="670" y="114" text-anchor="middle" font-size="9" fill="#555">llm_judge.py</text>
  <line x1="580" y1="122" x2="760" y2="122" stroke="#FFE0B2" stroke-width="1"/>
  <text x="670" y="138" text-anchor="middle" font-size="9" fill="#555">Clean code · Design patterns</text>
  <text x="670" y="152" text-anchor="middle" font-size="9" fill="#555">Framework idioms · Organization</text>
  <text x="670" y="168" text-anchor="middle" font-size="9" fill="#555">Cross-family judge assignment</text>
  <text x="670" y="184" text-anchor="middle" font-size="8" fill="#E09600">→ quality/llm_judge.json</text>

  <!-- Async arrow: artifacts feed judge separately -->
  <path d="M540 136 L560 136" stroke="#F5A623" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#a-orange)"/>

  <!-- Async annotation -->
  <text x="550" y="90" text-anchor="middle" font-size="8" fill="#E09600" transform="rotate(-90 550 90)">batch</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MERGE POINT: automated + judge results       -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Inline path down -->
  <path d="M300 192 L300 222" stroke="#4A6FA5" stroke-width="1.5" fill="none"/>
  <!-- Async path merges in -->
  <path d="M670 198 L670 218 L540 218 L540 230 L320 230" stroke="#F5A623" stroke-width="1" fill="none" stroke-dasharray="4 3"/>

  <!-- Merge circle -->
  <circle cx="308" cy="230" r="8" fill="#4A6FA5"/>
  <text x="308" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">+</text>
  <text x="340" y="234" font-size="8" fill="#8B8FA3">merge automated + judge scores</text>

  <!-- Arrow: merge → Layer 2 -->
  <path d="M308 238 L308 264" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Layer 2: Intra-Model Consistency             -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="264" width="720" height="112" rx="8" fill="#E8F5E9" stroke="#2A8F82" stroke-width="2"/>
  <text x="80" y="286" font-size="13" font-weight="700" fill="#2A8F82">Layer 2</text>
  <text x="140" y="286" font-size="13" font-weight="600" fill="#1A1A2E">Intra-Model Consistency</text>
  <text x="560" y="286" font-size="10" fill="#8B8FA3">Same model, same language, run-to-run</text>

  <!-- Structural stability -->
  <rect x="80" y="298" width="230" height="68" rx="4" fill="#FFFFFF" stroke="#C8E6C9" stroke-width="1"/>
  <text x="96" y="316" font-size="11" font-weight="600" fill="#1A1A2E">Structural Stability</text>
  <text x="96" y="332" font-size="9" fill="#555">• LOC coefficient of variation</text>
  <text x="96" y="346" font-size="9" fill="#555">• Function count σ</text>
  <text x="96" y="360" font-size="9" fill="#555">• Architecture fingerprint (Jaccard)</text>

  <!-- Quality stability -->
  <rect x="325" y="298" width="215" height="68" rx="4" fill="#FFFFFF" stroke="#C8E6C9" stroke-width="1"/>
  <text x="341" y="316" font-size="11" font-weight="600" fill="#1A1A2E">Quality Stability</text>
  <text x="341" y="332" font-size="9" fill="#555">• Clean code score σ</text>
  <text x="341" y="346" font-size="9" fill="#555">• Pattern selection consistency</text>
  <text x="341" y="360" font-size="9" fill="#555">• Quality floor / ceiling</text>

  <!-- Naming drift -->
  <rect x="555" y="298" width="205" height="68" rx="4" fill="#FFFFFF" stroke="#C8E6C9" stroke-width="1"/>
  <text x="571" y="316" font-size="11" font-weight="600" fill="#1A1A2E">Naming Drift</text>
  <text x="571" y="332" font-size="9" fill="#555">• Identifier Jaccard similarity</text>
  <text x="571" y="346" font-size="9" fill="#555">• Semantic clustering</text>
  <text x="571" y="360" font-size="9" fill="#555">• Convention adherence σ</text>

  <!-- Arrow: L2 → L3 -->
  <path d="M420 376 L420 408" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Layer 3: Inter-Model Comparison              -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="408" width="720" height="96" rx="8" fill="#FFF3E0" stroke="#F5A623" stroke-width="2"/>
  <text x="80" y="430" font-size="13" font-weight="700" fill="#E09600">Layer 3</text>
  <text x="140" y="430" font-size="13" font-weight="600" fill="#1A1A2E">Inter-Model Comparison</text>
  <text x="560" y="430" font-size="10" fill="#8B8FA3">Model A vs Model B, same language</text>

  <rect x="80" y="442" width="340" height="52" rx="4" fill="#FFFFFF" stroke="#FFE0B2" stroke-width="1"/>
  <text x="96" y="460" font-size="11" font-weight="600" fill="#1A1A2E">Statistical Tests</text>
  <text x="96" y="476" font-size="9" fill="#555">Mann-Whitney U • Kruskal-Wallis • Chi² • Bonferroni</text>
  <text x="96" y="488" font-size="9" fill="#555">Cohen's d effect sizes • Confidence intervals</text>

  <rect x="440" y="442" width="320" height="52" rx="4" fill="#FFFFFF" stroke="#FFE0B2" stroke-width="1"/>
  <text x="456" y="460" font-size="11" font-weight="600" fill="#1A1A2E">Quality-Consistency Frontier</text>
  <text x="456" y="476" font-size="9" fill="#555">★ Ideal (high quality + low variance)</text>
  <text x="456" y="488" font-size="9" fill="#555">● Unreliable (low quality + high variance)</text>

  <!-- Arrow: L3 → L4 -->
  <path d="M420 504 L420 536" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Layer 4: Model Generation Fingerprint        -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="536" width="720" height="96" rx="8" fill="#FCE4EC" stroke="#C0392B" stroke-width="2"/>
  <text x="80" y="558" font-size="13" font-weight="700" fill="#C0392B">Layer 4</text>
  <text x="140" y="558" font-size="13" font-weight="600" fill="#1A1A2E">Model Generation Fingerprint</text>
  <text x="555" y="558" font-size="10" fill="#8B8FA3">Per model — automated + judge merged</text>

  <rect x="80" y="570" width="170" height="52" rx="4" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="1"/>
  <text x="96" y="588" font-size="11" font-weight="600" fill="#1A1A2E">Pattern Signature</text>
  <text x="96" y="602" font-size="9" fill="#555">DI / DTO / Repository freq</text>
  <text x="96" y="616" font-size="9" fill="#555">Per-pattern present / absent %</text>

  <rect x="264" y="570" width="170" height="52" rx="4" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="1"/>
  <text x="280" y="588" font-size="11" font-weight="600" fill="#1A1A2E">Style Signature</text>
  <text x="280" y="602" font-size="9" fill="#555">SRP • naming • DRY • functions</text>
  <text x="280" y="616" font-size="9" fill="#555">5 clean-code subscores μ ± σ</text>

  <rect x="448" y="570" width="154" height="52" rx="4" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="1"/>
  <text x="464" y="588" font-size="11" font-weight="600" fill="#1A1A2E">Idiom Profile</text>
  <text x="464" y="602" font-size="9" fill="#555">Idiomatic / functional / anti %</text>
  <text x="464" y="616" font-size="9" fill="#555">Per-framework idiom rates</text>

  <rect x="616" y="570" width="144" height="52" rx="4" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="1"/>
  <text x="632" y="588" font-size="11" font-weight="600" fill="#1A1A2E">Error Philosophy</text>
  <text x="632" y="602" font-size="9" fill="#555">defensive / pragmatic /</text>
  <text x="632" y="616" font-size="9" fill="#555">minimal / optimistic</text>

  <!-- Left sidebar: data scope annotations -->
  <text x="36" y="152" text-anchor="middle" font-size="10" fill="#4A6FA5" transform="rotate(-90 36 152)">Per run</text>
  <text x="36" y="340" text-anchor="middle" font-size="10" fill="#2A8F82" transform="rotate(-90 36 340)">Per model×lang</text>
  <text x="36" y="460" text-anchor="middle" font-size="10" fill="#E09600" transform="rotate(-90 36 460)">Per language</text>
  <text x="36" y="585" text-anchor="middle" font-size="10" fill="#C0392B" transform="rotate(-90 36 585)">Per model</text>

  <!-- Footer -->
  <text x="420" y="660" text-anchor="middle" font-size="9" fill="#8B8FA3">
    Layer 1a runs inline during benchmark · Layer 1b (LLM judge) runs as independent batch process · Results merge at Layer 2 boundary
  </text>
</svg>
