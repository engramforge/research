<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="580" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">Entropy Control Process</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4A6FA5"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2A8F82"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
    <marker id="a-dark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1A1A2E"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 1: Start -->
  <!-- ═══════════════════════════════════════════ -->
  <circle cx="360" cy="76" r="24" fill="#4A6FA5" stroke="#3A5F95" stroke-width="1.5"/>
  <text x="360" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Start</text>

  <!-- Arrow: Start → Run -->
  <path d="M360 100 L360 132" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 2: Run Benchmark -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="260" y="132" width="200" height="52" rx="6" fill="#2A8F82" stroke="#1A7F72" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Run Benchmark</text>
  <text x="360" y="172" text-anchor="middle" font-size="10" fill="#C8EDE8">single iteration</text>

  <!-- Run counter annotation -->
  <rect x="484" y="136" width="96" height="44" rx="4" fill="#F5FAF9" stroke="#2A8F82" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="532" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#2A8F82">run_count++</text>
  <text x="532" y="170" text-anchor="middle" font-size="9" fill="#555">append result</text>
  <line x1="460" y1="158" x2="484" y2="158" stroke="#2A8F82" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Arrow: Run → Check N -->
  <path d="M360 184 L360 216" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 3: Decision — Enough runs? -->
  <!-- ═══════════════════════════════════════════ -->
  <polygon points="360,216 460,256 360,296 260,256" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="360" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">runs ≥ 2?</text>
  <text x="360" y="266" text-anchor="middle" font-size="10" fill="#555">(min for stats)</text>

  <!-- NO arrow: loop back up -->
  <path d="M260 256 L188 256 L188 158 L260 158" stroke="#C0392B" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="150" y="198" width="36" height="20" rx="3" fill="#FDE8E8" stroke="#C0392B" stroke-width="1"/>
  <text x="168" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#C0392B">no</text>

  <!-- YES arrow: down -->
  <path d="M360 296 L360 332" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#a-teal)"/>
  <rect x="370" y="300" width="36" height="20" rx="3" fill="#E8F5E9" stroke="#2A8F82" stroke-width="1"/>
  <text x="388" y="314" text-anchor="middle" font-size="10" font-weight="600" fill="#1A7F72">yes</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 4: Calculate Statistics -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="260" y="332" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="360" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Calculate Statistics</text>
  <text x="360" y="370" text-anchor="middle" font-size="10" fill="#555">mean, std dev, confidence</text>

  <!-- Stats annotation -->
  <rect x="484" y="332" width="192" height="52" rx="4" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="580" y="349" text-anchor="middle" font-size="9" fill="#4A6FA5">confidence = 1 − (σ / μ)</text>
  <text x="580" y="363" text-anchor="middle" font-size="9" fill="#4A6FA5">quality_std = σ / max_gates</text>
  <text x="580" y="377" text-anchor="middle" font-size="9" fill="#4A6FA5">CI = x̄ ± 1.96 · s/√n</text>
  <line x1="460" y1="358" x2="484" y2="358" stroke="#4A6FA5" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Arrow: Stats → Decision -->
  <path d="M360 384 L360 416" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 5: Decision — Confidence met? -->
  <!-- ═══════════════════════════════════════════ -->
  <polygon points="360,416 476,460 360,504 244,460" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="360" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">confidence ≥ target</text>
  <text x="360" y="463" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">AND variance ≤ threshold</text>
  <text x="360" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">OR runs ≥ max?</text>

  <!-- YES arrow: down to report -->
  <path d="M360 504 L360 536" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#a-teal)"/>
  <rect x="370" y="506" width="36" height="20" rx="3" fill="#E8F5E9" stroke="#2A8F82" stroke-width="1"/>
  <text x="388" y="520" text-anchor="middle" font-size="10" font-weight="600" fill="#1A7F72">yes</text>

  <!-- NO arrow: loop back to Run -->
  <path d="M244 460 L120 460 L120 158 L260 158" stroke="#C0392B" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="130" y="398" width="36" height="20" rx="3" fill="#FDE8E8" stroke="#C0392B" stroke-width="1"/>
  <text x="148" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#C0392B">no</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Step 6: Report -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="244" y="536" width="232" height="32" rx="6" fill="#1A1A2E" stroke="#1A1A2E" stroke-width="1.5"/>
  <text x="360" y="557" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Report: mean ± std (CI)</text>

</svg>
