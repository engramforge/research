  <circle cx="558" cy="533" r="5" fill="#F5A623"/>
  <text x="568" y="537" font-size="9" fill="#555">Ollama Cloud (†sub)</text>

  <text x="100" y="553" font-size="9" fill="#8B8FA3">★ IDEAL = high quality + low variance (top-right)  •  ● Unreliable = low quality + high variance (bottom-left)</text>

</svg>
