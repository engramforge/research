<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="580" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">Quality-Consistency Frontier</text>
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#8B8FA3">Mean gate score (quality) vs. gate σ (consistency) — 33 model×lang cells · n=5 each</text>

  <!-- Chart area: x=[80..760], y=[80..460] -->
  <!-- X axis: gate mean 2.0 → 5.0 (quality) -->
  <!-- Y axis: gate σ 0.0 → 3.0 (lower is more consistent) — INVERTED so top=better -->
  <!-- Transform: x = 80 + (mean - 2.0) * 226.67 -->
  <!--            y = 460 - (3.0 - σ) * 126.67   -->
  <!--            → σ=0 at y=80, σ=3.0 at y=460 -->

  <!-- Grid and axes -->
  <rect x="80" y="80" width="680" height="380" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Horizontal gridlines (σ values) -->
  <line x1="80" y1="80" x2="760" y2="80" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="84" text-anchor="end" font-size="9" fill="#999">0.0</text>
  <line x1="80" y1="143" x2="760" y2="143" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="147" text-anchor="end" font-size="9" fill="#999">0.5</text>
  <line x1="80" y1="207" x2="760" y2="207" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="211" text-anchor="end" font-size="9" fill="#999">1.0</text>
  <line x1="80" y1="270" x2="760" y2="270" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="274" text-anchor="end" font-size="9" fill="#999">1.5</text>
  <line x1="80" y1="333" x2="760" y2="333" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="337" text-anchor="end" font-size="9" fill="#999">2.0</text>
  <line x1="80" y1="396" x2="760" y2="396" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="400" text-anchor="end" font-size="9" fill="#999">2.5</text>
  <line x1="80" y1="460" x2="760" y2="460" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="72" y="464" text-anchor="end" font-size="9" fill="#999">3.0</text>

  <!-- Vertical gridlines (mean gate values) -->
  <line x1="80" y1="80" x2="80" y2="460" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="80" y="478" text-anchor="middle" font-size="9" fill="#999">2.0</text>
  <line x1="307" y1="80" x2="307" y2="460" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="307" y="478" text-anchor="middle" font-size="9" fill="#999">3.0</text>
  <line x1="533" y1="80" x2="533" y2="460" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="533" y="478" text-anchor="middle" font-size="9" fill="#999">4.0</text>
  <line x1="760" y1="80" x2="760" y2="460" stroke="#E8E8E8" stroke-width="0.5"/>
  <text x="760" y="478" text-anchor="middle" font-size="9" fill="#999">5.0</text>

  <!-- Axis labels -->
  <text x="420" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Mean Gates Passed (Quality →)</text>
  <text x="24" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#555" transform="rotate(-90 24 270)">Gate σ (← Consistency)</text>

  <!-- Quadrant labels (background) -->
  <!-- Top-left: mediocre but consistent -->
  <rect x="81" y="81" width="375" height="140" fill="#FFF8E1" opacity="0.3"/>
  <text x="268" y="98" text-anchor="middle" font-size="10" fill="#E09600" font-weight="500">■ Consistent but mediocre</text>

  <!-- Top-right: IDEAL -->
  <rect x="456" y="81" width="303" height="140" fill="#E8F5E9" opacity="0.3"/>
  <text x="608" y="98" text-anchor="middle" font-size="10" fill="#2A8F82" font-weight="600">★ IDEAL QUADRANT</text>

  <!-- Bottom-left: unreliable -->
  <rect x="81" y="221" width="375" height="238" fill="#FFEBEE" opacity="0.2"/>
  <text x="268" y="440" text-anchor="middle" font-size="10" fill="#C0392B" font-weight="500">● Unreliable</text>

  <!-- Bottom-right: erratic high quality -->
  <rect x="456" y="221" width="303" height="238" fill="#E3F2FD" opacity="0.2"/>
  <text x="608" y="440" text-anchor="middle" font-size="10" fill="#4A6FA5" font-weight="500">▲ High quality, erratic</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Data points (from actual quality_analysis output) -->
  <!-- x = 80 + (mean - 2.0) * 226.67, y = 80 + σ * 126.67 -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ★ IDEAL cluster: gates=5.0, σ=0.0 — 14 cells -->
  <!-- Spread slightly to avoid overlap -->
  <!-- Claude Opus 4.6 C#/Java -->
  <circle cx="760" cy="83" r="6" fill="#9B59B6" stroke="#8E44AD" stroke-width="1.5"/>
  <circle cx="752" cy="90" r="6" fill="#9B59B6" stroke="#8E44AD" stroke-width="1.5"/>
  <!-- Claude Sonnet 4.5 C#/Java -->
  <circle cx="744" cy="83" r="6" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <circle cx="737" cy="90" r="6" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Gemini 3 Flash C#/Java -->
  <circle cx="729" cy="83" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <circle cx="721" cy="90" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <!-- Gemini 3 Pro C#/Java/Python -->
  <circle cx="714" cy="83" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <circle cx="706" cy="90" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <circle cx="698" cy="83" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <!-- GPT-4o Python/Java -->
  <circle cx="691" cy="90" r="6" fill="#3498DB" stroke="#2980B9" stroke-width="1.5"/>
  <circle cx="683" cy="83" r="6" fill="#3498DB" stroke="#2980B9" stroke-width="1.5"/>
  <!-- GPT-4o-mini C#/Java -->
  <circle cx="675" cy="90" r="6" fill="#85C1E9" stroke="#5DADE2" stroke-width="1.5"/>
  <circle cx="668" cy="83" r="6" fill="#85C1E9" stroke="#5DADE2" stroke-width="1.5"/>
  <!-- GPT-5.2 Java -->
  <circle cx="660" cy="90" r="6" fill="#F39C12" stroke="#E67E22" stroke-width="1.5"/>

  <!-- Annotation for the big cluster -->
  <rect x="550" y="106" width="204" height="20" rx="3" fill="#E8F5E9" stroke="#2A8F82" stroke-width="1"/>
  <text x="652" y="120" text-anchor="middle" font-size="9" font-weight="600" fill="#2A8F82">14 cells: 5.0/5, σ=0.00</text>

  <!-- Gemini 2.5 Pro C#: 4.8, σ=0.45 → x=714, y=137 -->
  <circle cx="714" cy="137" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <text x="710" y="133" text-anchor="end" font-size="8" fill="#16A085">2.5Pro cs</text>

  <!-- Claude Sonnet Python: 4.8, σ=0.45 → x=714, y=137 -->
  <circle cx="724" cy="143" r="6" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <text x="740" y="155" font-size="8" fill="#C0392B">Son py</text>

  <!-- Gemini 3 Flash Python: 4.8, σ=0.45 → x=714, y=137 -->
  <circle cx="704" cy="143" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <text x="696" y="155" text-anchor="end" font-size="8" fill="#27AE60">Flash py</text>

  <!-- GPT-4o C#: 4.8, σ=0.45 → x=714, y=137 -->
  <circle cx="720" cy="150" r="6" fill="#3498DB" stroke="#2980B9" stroke-width="1.5"/>
  <text x="736" y="162" font-size="8" fill="#2980B9">4o cs</text>

  <!-- Qwen3 C#: 4.6, σ=0.55 → x=669, y=150 -->
  <circle cx="669" cy="150" r="6" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="665" y="144" text-anchor="end" font-size="8" fill="#E09600">Qwen3 cs</text>

  <!-- DeepSeek Python: 4.4, σ=0.55 → x=624, y=150 -->
  <circle cx="624" cy="150" r="6" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="618" y="144" text-anchor="end" font-size="8" fill="#E09600">DS py</text>

  <!-- Gemini 2.5 Pro Java: 4.2, σ=0.84 → x=579, y=186 -->
  <circle cx="579" cy="186" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <text x="590" y="199" font-size="8" fill="#16A085">2.5Pro java</text>

  <!-- DeepSeek Java: 4.2, σ=0.45 → x=579, y=137 -->
  <circle cx="579" cy="137" r="6" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="575" y="131" text-anchor="end" font-size="8" fill="#E09600">DS java</text>

  <!-- Qwen3 Python: 4.2, σ=1.10 → x=579, y=219 -->
  <circle cx="579" cy="219" r="6" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="590" y="232" font-size="8" fill="#E09600">Qwen3 py</text>

  <!-- GPT-5.2 C#: 4.0, σ=0.0 → x=533, y=80 -->
  <circle cx="533" cy="83" r="6" fill="#F39C12" stroke="#E67E22" stroke-width="1.5"/>
  <text x="529" y="77" text-anchor="end" font-size="8" fill="#E67E22">5.2 cs</text>

  <!-- Gemini 2.5 Pro Python: 4.0, σ=1.41 → x=533, y=259 -->
  <circle cx="533" cy="259" r="6" fill="#1ABC9C" stroke="#16A085" stroke-width="1.5"/>
  <text x="544" y="272" font-size="8" fill="#16A085">2.5Pro py</text>

  <!-- Gemini 2.5 Flash C#: 3.6, σ=0.55 → x=443, y=150 -->
  <circle cx="443" cy="150" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <text x="438" y="144" text-anchor="end" font-size="8" fill="#27AE60">2.5Fl cs</text>

  <!-- Gemini 2.5 Flash Java: 3.6, σ=0.55 → x=443, y=150 -->
  <circle cx="453" cy="156" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <text x="466" y="169" font-size="8" fill="#27AE60">2.5Fl java</text>

  <!-- Claude Opus Python: 3.6, σ=0.89 → x=443, y=193 -->
  <circle cx="443" cy="193" r="6" fill="#9B59B6" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="438" y="187" text-anchor="end" font-size="8" fill="#8E44AD">Opus py</text>

  <!-- Qwen3 Java: 3.4, σ=0.89 → x=397, y=193 -->
  <circle cx="397" cy="193" r="6" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="393" y="187" text-anchor="end" font-size="8" fill="#E09600">Qwen3 java</text>

  <!-- DeepSeek C#: 3.0, σ=2.74 → x=307, y=427 -->
  <circle cx="307" cy="427" r="7" fill="#F5A623" stroke="#E09600" stroke-width="1.5"/>
  <text x="320" y="425" font-size="8" fill="#E09600">DS cs</text>

  <!-- GPT-5.2 Python: 3.0, σ=2.74 → x=307, y=427 -->
  <circle cx="320" cy="434" r="7" fill="#F39C12" stroke="#E67E22" stroke-width="1.5"/>
  <text x="333" y="448" font-size="8" fill="#E67E22">5.2 py</text>

  <!-- Gemini 2.5 Flash Python: 2.8, σ=0.45 → x=261, y=137 -->
  <circle cx="261" cy="137" r="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5"/>
  <text x="257" y="131" text-anchor="end" font-size="8" fill="#27AE60">2.5Fl py</text>

  <!-- GPT-4o-mini Python: 0.8, σ=1.10 → x=80+(0.8-2.0)*226.67=-192 → clamp at x=82 -->
  <!-- This point is off the chart left (mean < 2.0), place at left edge with annotation -->
  <circle cx="82" cy="219" r="7" fill="#85C1E9" stroke="#5DADE2" stroke-width="2"/>
  <text x="94" y="216" font-size="8" font-weight="600" fill="#5DADE2">4o-mini py</text>
  <text x="94" y="228" font-size="7" fill="#5DADE2">0.8/5 (off-scale ←)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="80" y="515" width="680" height="48" rx="4" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="1"/>
  <circle cx="100" cy="533" r="5" fill="#2ECC71"/>
  <text x="110" y="537" font-size="9" fill="#555">Gemini</text>
  <circle cx="160" cy="533" r="5" fill="#E74C3C"/>
  <text x="170" y="537" font-size="9" fill="#555">Claude Sonnet</text>
  <circle cx="250" cy="533" r="5" fill="#9B59B6"/>
  <text x="260" y="537" font-size="9" fill="#555">Claude Opus</text>
  <circle cx="340" cy="533" r="5" fill="#3498DB"/>
  <text x="350" y="537" font-size="9" fill="#555">GPT-4o</text>
  <circle cx="400" cy="533" r="5" fill="#85C1E9"/>
