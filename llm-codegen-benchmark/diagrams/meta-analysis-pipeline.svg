<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="550" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">Meta-Analysis Pipeline</text>
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#8B8FA3">From code artifacts → quality metrics → fingerprints → publication figures</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4A6FA5"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2A8F82"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E09600"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!-- INPUT: Code Artifacts (from benchmark runs) -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="72" width="200" height="64" rx="8" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Code Artifacts</text>
  <text x="160" y="112" text-anchor="middle" font-size="9" fill="#555">165 entropy-controlled runs</text>
  <text x="160" y="124" text-anchor="middle" font-size="9" fill="#555">11 models × 3 languages</text>

  <!-- Filter badge -->
  <rect x="80" y="60" width="160" height="16" rx="8" fill="#2A8F82" stroke="none"/>
  <text x="160" y="71" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">run_manifest.json filter</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SPLIT: Two parallel analysis tracks -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Arrow: Artifacts → Static Analysis -->
  <path d="M260 104 L320 104" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#a-teal)"/>

  <!-- Arrow: Artifacts → LLM Judge (routed above) -->
  <path d="M260 88 L300 88 L300 62 L574 62 L574 88 L580 88" stroke="#F5A623" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#a-orange)"/>

  <!-- Static Analysis Track -->
  <rect x="330" y="72" width="200" height="64" rx="8" fill="#E8F5E9" stroke="#2A8F82" stroke-width="2"/>
  <text x="430" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Static Analysis</text>
  <text x="430" y="106" text-anchor="middle" font-size="9" fill="#555">static_analysis.py</text>
  <text x="430" y="118" text-anchor="middle" font-size="8" fill="#8B8FA3">AST parse · complexity · LOC</text>
  <text x="430" y="128" text-anchor="middle" font-size="8" fill="#8B8FA3">type hints · docstrings · naming</text>

  <!-- LLM Judge Track -->
  <rect x="580" y="72" width="200" height="64" rx="8" fill="#FFF3E0" stroke="#F5A623" stroke-width="2"/>
  <text x="680" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">LLM Judge</text>
  <text x="680" y="106" text-anchor="middle" font-size="9" fill="#555">llm_judge.py</text>
  <text x="680" y="118" text-anchor="middle" font-size="8" fill="#8B8FA3">Clean code · patterns · idioms</text>
  <text x="680" y="128" text-anchor="middle" font-size="8" fill="#8B8FA3">Cross-family judge assignment</text>

  <!-- Phase labels -->
  <rect x="340" y="58" width="56" height="14" rx="3" fill="#2A8F82"/>
  <text x="368" y="68" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Phase 1a</text>
  <rect x="590" y="58" width="56" height="14" rx="3" fill="#F5A623"/>
  <text x="618" y="68" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Phase 1b</text>

  <!-- Output: automated.json -->
  <path d="M430 136 L430 168" stroke="#2A8F82" stroke-width="1.5" fill="none" marker-end="url(#a-teal)"/>
  <rect x="350" y="170" width="160" height="32" rx="4" fill="#FFFFFF" stroke="#2A8F82" stroke-width="1.5"/>
  <text x="430" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#2A8F82">quality/automated.json</text>

  <!-- Output: llm_judge.json -->
  <path d="M680 136 L680 168" stroke="#F5A623" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <rect x="600" y="170" width="160" height="32" rx="4" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.5"/>
  <text x="680" y="190" text-anchor="middle" font-size="9" font-weight="600" fill="#E09600">quality/llm_judge.json</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT SIDEBAR: Language stacks               -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="155" width="200" height="112" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="160" y="174" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">Language-Isolated Analysis</text>
  <line x1="80" y1="180" x2="240" y2="180" stroke="#E8E8E8" stroke-width="1"/>

  <rect x="80" y="188" width="60" height="18" rx="3" fill="#3572A5" stroke="none"/>
  <text x="110" y="200" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Python</text>
  <text x="150" y="200" font-size="8" fill="#555">FastAPI · AST · radon · mypy</text>

  <rect x="80" y="212" width="60" height="18" rx="3" fill="#178600" stroke="none"/>
  <text x="110" y="224" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">C#</text>
  <text x="150" y="224" font-size="8" fill="#555">ASP.NET · Roslyn · StyleCop</text>

  <rect x="80" y="236" width="60" height="18" rx="3" fill="#B07219" stroke="none"/>
  <text x="110" y="248" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Java</text>
  <text x="150" y="248" font-size="8" fill="#555">Spring · PMD · Checkstyle</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MERGE: Quality Analysis Engine               -->
  <!-- ═══════════════════════════════════════════ -->
  <path d="M430 202 L430 240 L579 240" stroke="#2A8F82" stroke-width="1.5" fill="none"/>
  <path d="M680 202 L680 240 L595 240" stroke="#F5A623" stroke-width="1.5" fill="none"/>
  <circle cx="587" cy="240" r="8" fill="#4A6FA5"/>
  <text x="587" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">+</text>
  <path d="M587 248 L587 270" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Phase 2 label -->
  <rect x="450" y="260" width="56" height="14" rx="3" fill="#4A6FA5"/>
  <text x="478" y="270" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Phase 2</text>

  <!-- Engine box — light fill, not dark -->
  <rect x="440" y="272" width="296" height="56" rx="8" fill="#E8EEF7" stroke="#4A6FA5" stroke-width="2"/>
  <text x="588" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#4A6FA5">Quality Analysis Engine</text>
  <text x="588" y="310" text-anchor="middle" font-size="9" fill="#4A6FA5">quality_analysis.py — Layers 2, 3, 4</text>
  <text x="588" y="322" text-anchor="middle" font-size="8" fill="#555">Intra-model · Inter-model · Fingerprints</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- OUTPUT: Four analysis products               -->
  <!-- ═══════════════════════════════════════════ -->
  <path d="M588 328 L588 356" stroke="#4A6FA5" stroke-width="1.5" fill="none"/>
  <path d="M588 356 L145 356 L145 388" stroke="#2A8F82" stroke-width="1" fill="none" marker-end="url(#a-teal)"/>
  <path d="M588 356 L329 356 L329 388" stroke="#F5A623" stroke-width="1" fill="none" marker-end="url(#a-orange)"/>
  <path d="M588 356 L526 356 L526 388" stroke="#4A6FA5" stroke-width="1" fill="none" marker-end="url(#a)"/>
  <path d="M588 356 L712 356 L712 388" stroke="#C0392B" stroke-width="1" fill="none" marker-end="url(#a-red)"/>

  <!-- Phase 3 label -->
  <rect x="60" y="370" width="56" height="14" rx="3" fill="#8B8FA3"/>
  <text x="88" y="380" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Phase 3</text>

  <!-- Output 1: Intra-model consistency -->
  <rect x="60" y="388" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#2A8F82" stroke-width="1.5"/>
  <text x="145" y="406" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">Intra-Model</text>
  <text x="145" y="420" text-anchor="middle" font-size="8" fill="#555">LOC CV · struct Jaccard · naming</text>
  <text x="145" y="434" text-anchor="middle" font-size="8" fill="#2A8F82">33 model × language cells</text>

  <!-- Output 2: Inter-model comparison -->
  <rect x="244" y="388" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.5"/>
  <text x="329" y="406" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">Inter-Model</text>
  <text x="329" y="420" text-anchor="middle" font-size="8" fill="#555">Head-to-head per language</text>
  <text x="329" y="434" text-anchor="middle" font-size="8" fill="#E09600">Mann-Whitney U · Cohen's d</text>

  <!-- Output 3: Quality-Consistency Frontier -->
  <rect x="428" y="388" width="196" height="56" rx="6" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="526" y="406" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">Quality–Consistency</text>
  <text x="526" y="420" text-anchor="middle" font-size="8" fill="#555">★ Ideal / ● Unreliable quadrants</text>
  <text x="526" y="434" text-anchor="middle" font-size="8" fill="#4A6FA5">Mean quality × variance scatter</text>

  <!-- Output 4: Model Fingerprints -->
  <rect x="638" y="388" width="148" height="56" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="712" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#1A1A2E">Fingerprints</text>
  <text x="712" y="416" text-anchor="middle" font-size="7" fill="#555">Pattern · Style · Idiom · Error</text>
  <text x="712" y="428" text-anchor="middle" font-size="7" fill="#555">signatures per model × language</text>
  <text x="712" y="440" text-anchor="middle" font-size="7" fill="#C0392B">11 models · automated + judge merged</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- VISUALIZATION: Publication figures           -->
  <!-- ═══════════════════════════════════════════ -->
  <path d="M145 444 L145 470" stroke="#2A8F82" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <path d="M329 444 L329 470" stroke="#F5A623" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <path d="M526 444 L526 470" stroke="#4A6FA5" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <path d="M712 444 L712 470" stroke="#C0392B" stroke-width="1" fill="none" stroke-dasharray="4 3"/>

  <rect x="60" y="470" width="726" height="52" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="70" y="458" width="56" height="14" rx="3" fill="#8B8FA3"/>
  <text x="98" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Phase 4</text>

  <text x="423" y="488" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Publication Figures</text>

  <!-- Figure thumbnails — evenly spaced -->
  <rect x="80" y="496" width="40" height="20" rx="2" fill="#E8F5E9" stroke="#2A8F82" stroke-width="0.5"/>
  <text x="130" y="510" font-size="8" fill="#555">Box plots</text>

  <rect x="200" y="496" width="40" height="20" rx="2" fill="#FFF3E0" stroke="#F5A623" stroke-width="0.5"/>
  <text x="250" y="510" font-size="8" fill="#555">Heatmaps</text>

  <rect x="330" y="496" width="40" height="20" rx="2" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="0.5"/>
  <text x="380" y="510" font-size="8" fill="#555">Frontier plots</text>

  <rect x="470" y="496" width="40" height="20" rx="2" fill="#FCE4EC" stroke="#C0392B" stroke-width="0.5"/>
  <text x="520" y="510" font-size="8" fill="#555">Radar charts</text>

  <rect x="600" y="496" width="40" height="20" rx="2" fill="#FFFFFF" stroke="#555" stroke-width="0.5"/>
  <text x="650" y="510" font-size="8" fill="#555">Comparison matrix</text>

  <!-- Footer status -->
  <text x="420" y="542" text-anchor="middle" font-size="9" fill="#8B8FA3">
    All phases complete · 165/165 runs scored · see §5.6, Appendix G.7
  </text>
</svg>
