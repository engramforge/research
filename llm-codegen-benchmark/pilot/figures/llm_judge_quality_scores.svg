      <rect x="0" y="6" width="557" height="22" rx="3" fill="url(#barGrad1)" filter="url(#shadow)" opacity="0.95"/>
      <text x="563" y="22" font-size="10" font-weight="700" fill="#3b82f6">4.28</text>
