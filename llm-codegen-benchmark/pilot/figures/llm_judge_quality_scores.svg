    <rect x="80" y="0" width="12" height="12" rx="2" fill="url(#barGrad2)"/>
    <text x="96" y="10" font-size="10" fill="#4b5563">Anthropic</text>
    <rect x="175" y="0" width="12" height="12" rx="2" fill="url(#barGrad3)"/>
    <text x="191" y="10" font-size="10" fill="#4b5563">Google</text>
    <rect x="250" y="0" width="12" height="12" rx="2" fill="url(#barGrad4)"/>
    <text x="266" y="10" font-size="10" fill="#4b5563">Open-weight</text>
    <line x1="360" y1="6" x2="390" y2="6" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
    <line x1="360" y1="2" x2="360" y2="10" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
    <line x1="390" y1="2" x2="390" y2="10" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
