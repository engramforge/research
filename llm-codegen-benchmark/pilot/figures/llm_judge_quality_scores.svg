    <line x1="130" y1="0" x2="130" y2="396" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="260" y1="0" x2="260" y2="396" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="390" y1="0" x2="390" y2="396" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4,4"/>
