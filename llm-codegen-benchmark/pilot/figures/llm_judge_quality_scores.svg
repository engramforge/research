    <text x="260" y="-6" text-anchor="middle" font-size="9" fill="#9ca3af">2</text>
    <text x="390" y="-6" text-anchor="middle" font-size="9" fill="#9ca3af">3</text>
    <text x="520" y="-6" text-anchor="middle" font-size="9" fill="#9ca3af">4</text>
    <text x="650" y="-6" text-anchor="middle" font-size="9" fill="#9ca3af">5</text>

