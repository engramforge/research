  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">LLM Judge: Code Quality Scores (n=165 runs, 11 models × 3 frameworks × 5 reps)</text>
