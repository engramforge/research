<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="620" rx="12" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="828" height="588" rx="8" fill="white" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="430" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Meta-Prompting A/B Test: Baseline vs Adapted Gate Pass Rates</text>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#64748b">FastAPI-001 (Add Orders CRUD) · n=5 per condition · temperature=0.2 · sorted by improvement</text>

  <!-- Subtle zone backgrounds (chart area: x 240–800) -->
  <rect x="240" y="73" width="570" height="252" rx="4" fill="#f0fdf4" opacity="0.5"/>
  <rect x="240" y="325" width="570" height="42" rx="0" fill="#f8fafc" opacity="0.5"/>
  <rect x="240" y="367" width="570" height="172" rx="4" fill="#fef2f2" opacity="0.5"/>

  <!-- Zone labels (rotated) -->
  <text x="822" y="195" font-size="9" fill="#16a34a" opacity="0.6" text-anchor="middle" transform="rotate(-90, 822, 195)">IMPROVED</text>
  <text x="822" y="450" font-size="9" fill="#dc2626" opacity="0.6" text-anchor="middle" transform="rotate(-90, 822, 450)">DEGRADED</text>

  <!-- X-axis grid lines (chart: 240–800, 112px per gate) -->
  <line x1="240" y1="73" x2="240" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="240" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">0</text>
  <line x1="352" y1="73" x2="352" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="352" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">1</text>
  <line x1="464" y1="73" x2="464" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="464" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">2</text>
  <line x1="576" y1="73" x2="576" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="576" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">3</text>
  <line x1="688" y1="73" x2="688" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="688" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">4</text>
  <line x1="800" y1="73" x2="800" y2="540" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="800" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">5</text>

  <text x="520" y="570" text-anchor="middle" font-size="10" fill="#64748b" font-weight="500">Gates Passed (out of 5)</text>

  <!-- Column headers -->
  <text x="36" y="80" font-size="9" fill="#94a3b8" font-weight="600">MODEL</text>
  <text x="210" y="80" font-size="9" fill="#94a3b8" font-weight="600" text-anchor="end">Δ</text>

  <!-- ── ROW 0: GPT-4o-mini  bl=2.00 ad=5.00  Δ=+3.00 SIG ── -->
  <!-- bl: 240 + 2.00*112 = 464   ad: 240 + 5.00*112 = 800 -->
  <text x="36" y="100" font-size="11.5" fill="#0f172a" font-weight="700">GPT-4o-mini</text>
  <text x="210" y="100" text-anchor="end" font-size="11" fill="#16a34a" font-weight="700">+3.00</text>
  <text x="218" y="100" font-size="11" fill="#eab308">★</text>
  <line x1="464" y1="96" x2="800" y2="96" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="464" cy="96" r="5.5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="800" cy="96" r="5.5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 1: Claude Opus 4.6  bl=3.80 ad=5.00  Δ=+1.20 SIG ── -->
  <!-- bl: 240 + 3.80*112 = 666   ad: 800 -->
  <text x="36" y="140" font-size="11.5" fill="#0f172a" font-weight="700">Claude Opus 4.6</text>
  <text x="210" y="140" text-anchor="end" font-size="11" fill="#16a34a" font-weight="700">+1.20</text>
  <text x="218" y="140" font-size="11" fill="#eab308">★</text>
  <line x1="666" y1="136" x2="800" y2="136" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="666" cy="136" r="5.5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="800" cy="136" r="5.5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 2: Gemini 2.5 Pro  bl=4.40 ad=5.00  Δ=+0.60 ── -->
  <!-- bl: 240 + 4.40*112 = 733   ad: 800 -->
  <text x="36" y="180" font-size="11.5" fill="#0f172a">Gemini 2.5 Pro</text>
  <text x="210" y="180" text-anchor="end" font-size="11" fill="#16a34a">+0.60</text>
  <line x1="733" y1="176" x2="800" y2="176" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="733" cy="176" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="800" cy="176" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 3: Gemini 3 Flash  bl=4.20 ad=4.80  Δ=+0.60 ── -->
  <!-- bl: 240 + 4.20*112 = 710   ad: 240 + 4.80*112 = 778 -->
  <text x="36" y="220" font-size="11.5" fill="#0f172a">Gemini 3 Flash</text>
  <text x="210" y="220" text-anchor="end" font-size="11" fill="#16a34a">+0.60</text>
  <line x1="710" y1="216" x2="778" y2="216" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="710" cy="216" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="778" cy="216" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 4: DeepSeek V3.2  bl=4.20 ad=4.60  Δ=+0.40 ── -->
  <!-- bl: 710   ad: 240 + 4.60*112 = 755 -->
  <text x="36" y="260" font-size="11.5" fill="#0f172a">DeepSeek V3.2</text>
  <text x="210" y="260" text-anchor="end" font-size="11" fill="#16a34a">+0.40</text>
  <line x1="710" y1="256" x2="755" y2="256" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="710" cy="256" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="755" cy="256" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 5: Claude Sonnet 4.5  bl=4.80 ad=5.00  Δ=+0.20 ── -->
  <!-- bl: 778   ad: 800 -->
  <text x="36" y="300" font-size="11.5" fill="#0f172a">Claude Sonnet 4.5</text>
  <text x="210" y="300" text-anchor="end" font-size="11" fill="#16a34a">+0.20</text>
  <line x1="778" y1="296" x2="800" y2="296" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="778" cy="296" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="800" cy="296" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>

  <!-- ── ROW 6: GPT-4o  bl=5.00 ad=5.00  Δ=0.00 ── -->
  <text x="36" y="340" font-size="11.5" fill="#0f172a">GPT-4o</text>
  <text x="210" y="340" text-anchor="end" font-size="11" fill="#6b7280">0.00</text>
  <circle cx="800" cy="336" r="5" fill="#e2e8f0" stroke="#6b7280" stroke-width="2"/>
  <circle cx="800" cy="336" r="2.5" fill="#6b7280"/>

  <!-- ── ROW 7: Gemini 3 Pro  bl=5.00 ad=4.60  Δ=-0.40 ── -->
  <!-- bl: 800   ad: 755 -->
  <text x="36" y="380" font-size="11.5" fill="#0f172a">Gemini 3 Pro</text>
  <text x="210" y="380" text-anchor="end" font-size="11" fill="#dc2626">−0.40</text>
  <line x1="800" y1="376" x2="755" y2="376" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="800" cy="376" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="755" cy="376" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>

  <!-- ── ROW 8: Qwen3-Coder  bl=4.60 ad=4.00  Δ=-0.60 ── -->
  <!-- bl: 755   ad: 688 -->
  <text x="36" y="420" font-size="11.5" fill="#0f172a">Qwen3-Coder</text>
  <text x="210" y="420" text-anchor="end" font-size="11" fill="#dc2626">−0.60</text>
  <line x1="755" y1="416" x2="688" y2="416" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="755" cy="416" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="688" cy="416" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>

  <!-- ── ROW 9: Gemini 2.5 Flash  bl=2.80 ad=2.00  Δ=-0.80 ── -->
  <!-- bl: 240 + 2.80*112 = 554   ad: 464 -->
  <text x="36" y="460" font-size="11.5" fill="#0f172a">Gemini 2.5 Flash</text>
  <text x="210" y="460" text-anchor="end" font-size="11" fill="#dc2626">−0.80</text>
  <line x1="554" y1="456" x2="464" y2="456" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="554" cy="456" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="464" cy="456" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>

  <!-- ── ROW 10: GPT-5.2  bl=5.00 ad=3.60  Δ=-1.40 SIG ── -->
  <!-- bl: 800   ad: 240 + 3.60*112 = 643 -->
  <text x="36" y="500" font-size="11.5" fill="#0f172a" font-weight="700">GPT-5.2</text>
  <text x="210" y="500" text-anchor="end" font-size="11" fill="#dc2626" font-weight="700">−1.40</text>
  <text x="218" y="500" font-size="11" fill="#eab308">★</text>
  <line x1="800" y1="496" x2="643" y2="496" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="800" cy="496" r="5.5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="643" cy="496" r="5.5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>

  <!-- Separator -->
  <line x1="36" y1="520" x2="824" y2="520" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══════════ LEGEND ═══════════ -->
  <circle cx="55" cy="540" r="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <text x="65" y="544" font-size="10" fill="#475569">Baseline</text>
  <circle cx="130" cy="540" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="544" font-size="10" fill="#475569">Adapted (improved)</text>
  <circle cx="275" cy="540" r="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="285" y="544" font-size="10" fill="#475569">Adapted (degraded)</text>
  <text x="420" y="544" font-size="11" fill="#eab308">★</text>
  <text x="432" y="544" font-size="10" fill="#475569">p &lt; 0.05 (Mann-Whitney U)</text>

  <!-- ═══════════ SUMMARY BAR ═══════════ -->
  <rect x="36" y="558" width="788" height="38" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

  <text x="56" y="578" font-size="10" fill="#475569">
    <tspan font-weight="600" fill="#0f172a">Mean:</tspan> 4.16 → 4.42 gates
    <tspan font-weight="600" fill="#16a34a">(+6.1%)</tspan>
  </text>
  <line x1="262" y1="564" x2="262" y2="590" stroke="#cbd5e1" stroke-width="1"/>

  <text x="280" y="578" font-size="10" fill="#475569">
    <tspan font-weight="600" fill="#0f172a">Direction:</tspan>
    <tspan fill="#16a34a">6 improved</tspan> ·
    <tspan fill="#dc2626">4 degraded</tspan> ·
    <tspan fill="#6b7280">1 unchanged</tspan>
  </text>
  <line x1="540" y1="564" x2="540" y2="590" stroke="#cbd5e1" stroke-width="1"/>

  <text x="558" y="578" font-size="10" fill="#475569">
    <tspan font-weight="600" fill="#0f172a">Sign test:</tspan> p = 0.754 (not significant)
  </text>
  <line x1="722" y1="564" x2="722" y2="590" stroke="#cbd5e1" stroke-width="1"/>

  <text x="740" y="578" font-size="10" fill="#475569">
    <tspan font-weight="600" fill="#0f172a">Sig:</tspan> 3/11
  </text>

  <!-- Mean reference lines -->
  <!-- baseline mean 4.16: 240 + 4.16*112 = 706 -->
  <line x1="706" y1="73" x2="706" y2="540" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,4" opacity="0.35"/>
  <text x="706" y="548" text-anchor="middle" font-size="8" fill="#3b82f6" opacity="0.6">μ=4.16</text>
  <!-- adapted mean 4.42: 240 + 4.42*112 = 735 -->
  <line x1="735" y1="73" x2="735" y2="540" stroke="#f97316" stroke-width="1" stroke-dasharray="3,4" opacity="0.35"/>
  <text x="735" y="548" text-anchor="middle" font-size="8" fill="#f97316" opacity="0.6">μ=4.42</text>
</svg>
