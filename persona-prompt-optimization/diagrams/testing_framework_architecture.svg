<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4A6FA5"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1A2E">
    Automated Persona Optimization Testing Framework
  </text>
  
  <!-- Stage 1: Input -->
  <rect x="50" y="60" width="160" height="80" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="130" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Base Persona</text>
  <text x="130" y="110" text-anchor="middle" font-size="10" fill="#555">Production prompt</text>
  <text x="130" y="125" text-anchor="middle" font-size="10" fill="#555">(YAML config)</text>
  
  <!-- Arrow 1 -->
  <path d="M 210 100 L 270 100" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: Variation Generator -->
  <rect x="270" y="60" width="180" height="120" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="360" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Variation Generator</text>
  <text x="360" y="105" text-anchor="middle" font-size="10" fill="#555">• more_production</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#555">• more_metrics</text>
  <text x="360" y="135" text-anchor="middle" font-size="10" fill="#555">• hybrid (winner)</text>
  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#555">• concise</text>
  <text x="360" y="165" text-anchor="middle" font-size="10" fill="#555">• claude_xml, etc.</text>
  
  <!-- Arrow 2 -->
  <path d="M 450 120 L 510 120" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Test Harness -->
  <rect x="510" y="60" width="160" height="120" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="590" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Test Harness</text>
  <text x="590" y="105" text-anchor="middle" font-size="10" fill="#555">For each variation:</text>
  <text x="590" y="120" text-anchor="middle" font-size="10" fill="#555">1. Apply temporarily</text>
  <text x="590" y="135" text-anchor="middle" font-size="10" fill="#555">2. Run N questions</text>
  <text x="590" y="150" text-anchor="middle" font-size="10" fill="#555">3. Collect metrics</text>
  <text x="590" y="165" text-anchor="middle" font-size="10" fill="#555">4. Restore original</text>
  
  <!-- Arrow 3 (down) -->
  <path d="M 590 180 L 590 230" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: Evaluation Pipeline -->
  <rect x="510" y="230" width="160" height="100" rx="6" fill="#2A8F82" stroke="#1A7F72" stroke-width="1.5"/>
  <text x="590" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Evaluation Pipeline</text>
  <text x="590" y="275" text-anchor="middle" font-size="10" fill="#D6E0F0">Multi-dimensional scoring:</text>
  <text x="590" y="290" text-anchor="middle" font-size="9" fill="#D6E0F0">accuracy, complexity,</text>
  <text x="590" y="303" text-anchor="middle" font-size="9" fill="#D6E0F0">experience, security,</text>
  <text x="590" y="316" text-anchor="middle" font-size="9" fill="#D6E0F0">optimization, understanding</text>
  
  <!-- Arrow 4 (left) -->
  <path d="M 510 280 L 450 280" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 5: Metrics Collection -->
  <rect x="270" y="230" width="180" height="100" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="360" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Metrics Collection</text>
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#555">• Average score</text>
  <text x="360" y="290" text-anchor="middle" font-size="10" fill="#555">• Token usage/speed</text>
  <text x="360" y="305" text-anchor="middle" font-size="10" fill="#555">• Cost, elapsed time</text>
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#555">• Model identifier</text>
  
  <!-- Arrow 5 (left) -->
  <path d="M 270 280 L 210 280" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 6: Results Analysis -->
  <rect x="50" y="230" width="160" height="100" rx="6" fill="#F0F4FF" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="130" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A2E">Results Analysis</text>
  <text x="130" y="275" text-anchor="middle" font-size="10" fill="#555">• Rank by score</text>
  <text x="130" y="290" text-anchor="middle" font-size="10" fill="#555">• Identify winner</text>
  <text x="130" y="305" text-anchor="middle" font-size="10" fill="#555">• Export JSON</text>
  <text x="130" y="320" text-anchor="middle" font-size="10" fill="#555">• Generate report</text>
  
  <!-- Arrow 6 (down) -->
  <path d="M 130 330 L 130 380" stroke="#4A6FA5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 7: Output -->
  <rect x="50" y="380" width="160" height="80" rx="6" fill="#E8F5E9" stroke="#2A8F82" stroke-width="1.5"/>
  <text x="130" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#1A7F72">Optimized Persona</text>
  <text x="130" y="430" text-anchor="middle" font-size="11" fill="#1A7F72">🏆 Hybrid: +4.6 pts</text>
  <text x="130" y="445" text-anchor="middle" font-size="10" fill="#555">Deploy to production</text>
  
  <!-- Pattern Analysis Box (side) -->
  <rect x="50" y="490" width="700" height="80" rx="6" fill="#F5F5F5" stroke="#8B8FA3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="510" text-anchor="middle" font-size="11" font-weight="600" fill="#1A1A2E">Pattern Correlation Analysis (Automated)</text>
  <text x="400" y="530" text-anchor="middle" font-size="10" fill="#555">Production scenarios: +5.8 correlation | Metrics: +2.0 | First-person: +1.3 | Lessons learned: +0.3</text>
  <text x="400" y="548" text-anchor="middle" font-size="10" fill="#8B8FA3">Identifies which content patterns correlate with higher scores across all variations</text>
  <text x="400" y="563" text-anchor="middle" font-size="9" font-style="italic" fill="#8B8FA3">Informs future optimization strategies and template design</text>
  
  <!-- Legend -->
  <text x="50" y="590" font-size="9" fill="#8B8FA3">Automated testing cycle: ~24 minutes for 8 variations × 2 questions = 16 tests (~$0.37 total cost)</text>
</svg>
